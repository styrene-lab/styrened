<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- MCU (microcontroller): chip with pins -->
  <rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" opacity="0.9"/>
  <!-- Chip label area -->
  <rect x="8" y="8" width="8" height="8" rx="0.5" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
  <!-- Pin 1 marker -->
  <circle cx="9.5" cy="9.5" r="0.8" fill="currentColor" opacity="0.3"/>
  <!-- Pins left -->
  <line x1="3" y1="9" x2="6" y2="9" stroke="currentColor" stroke-width="1.2"/>
  <line x1="3" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.2"/>
  <line x1="3" y1="15" x2="6" y2="15" stroke="currentColor" stroke-width="1.2"/>
  <!-- Pins right -->
  <line x1="18" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="1.2"/>
  <line x1="18" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.2"/>
  <line x1="18" y1="15" x2="21" y2="15" stroke="currentColor" stroke-width="1.2"/>
  <!-- Pins top -->
  <line x1="9" y1="3" x2="9" y2="6" stroke="currentColor" stroke-width="1.2"/>
  <line x1="12" y1="3" x2="12" y2="6" stroke="currentColor" stroke-width="1.2"/>
  <line x1="15" y1="3" x2="15" y2="6" stroke="currentColor" stroke-width="1.2"/>
  <!-- Pins bottom -->
  <line x1="9" y1="18" x2="9" y2="21" stroke="currentColor" stroke-width="1.2"/>
  <line x1="12" y1="18" x2="12" y2="21" stroke="currentColor" stroke-width="1.2"/>
  <line x1="15" y1="18" x2="15" y2="21" stroke="currentColor" stroke-width="1.2"/>
</svg>
