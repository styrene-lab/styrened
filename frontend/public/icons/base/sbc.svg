<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- SBC (single board computer): circuit board -->
  <rect x="3" y="5" width="18" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- CPU -->
  <rect x="9" y="9" width="6" height="6" rx="0.5" fill="currentColor"/>
  <!-- GPIO pins top -->
  <line x1="6" y1="3" x2="6" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <line x1="9" y1="3" x2="9" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <line x1="12" y1="3" x2="12" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <line x1="15" y1="3" x2="15" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <line x1="18" y1="3" x2="18" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <!-- Ports right -->
  <rect x="21" y="8" width="1" height="3" fill="currentColor"/>
  <rect x="21" y="13" width="1" height="3" fill="currentColor"/>
  <!-- Traces -->
  <line x1="5" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="0.8"/>
  <line x1="15" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="0.8"/>
</svg>
