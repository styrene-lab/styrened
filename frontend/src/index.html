<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STYRENED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./theme/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='24'>⬡</text></svg>" />
</head>
<body>
  <div class="crt-overlay"></div>
  <header class="header">
    <div class="header-content">
      <div class="title-section">
        <h1 class="title">STYRENED</h1>
        <div class="stats-inline" id="header-stats">
          <span class="stat-inline" id="header-identity">---</span>
          <span class="stat-sep">|</span>
          <span class="stat-inline" id="header-status">CONNECTING</span>
        </div>
      </div>
    </div>
  </header>
  <div class="app-layout">
    <nav class="nav-sidebar" id="nav-sidebar">
      <a class="nav-item active" data-panel="topology" href="#/topology">
        <span class="nav-icon">&#x2B21;</span>
        <span class="nav-label">MESH</span>
      </a>
      <a class="nav-item" data-panel="chat" href="#/chat">
        <span class="nav-icon">&#x2709;</span>
        <span class="nav-label">CHAT</span>
      </a>
      <a class="nav-item" data-panel="contacts" href="#/contacts">
        <span class="nav-icon">&#x2630;</span>
        <span class="nav-label">BOOK</span>
      </a>
      <a class="nav-item" data-panel="fleet" href="#/fleet">
        <span class="nav-icon">&#x2318;</span>
        <span class="nav-label">OPS</span>
      </a>
      <a class="nav-item" data-panel="status" href="#/status">
        <span class="nav-icon">&#x2261;</span>
        <span class="nav-label">STATUS</span>
      </a>
      <a class="nav-item" data-panel="settings" href="#/settings">
        <span class="nav-icon">&#x2699;</span>
        <span class="nav-label">CONFIG</span>
      </a>
    </nav>
    <main class="panel-container" id="panel-container">
      <div class="loading-container" id="app-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">INITIALIZING<span class="cursor">_</span></div>
      </div>
    </main>
  </div>
  <footer class="status-footer">
    <span class="footer-status" id="footer-connection">SSE: ---</span>
    <span class="footer-sep">|</span>
    <span class="footer-tagline">STYRENE MESH NETWORK</span>
    <span class="footer-spacer"></span>
  </footer>
  <script type="module" src="./main.ts"></script>
</body>
</html>
