[reticulum]
  enable_transport = True
  share_instance = False

[logging]
  loglevel = 4

[interfaces]
  [[TCP Server Alpha]]
    type = TCPServerInterface
    enabled = True
    listen_ip = 0.0.0.0
    listen_port = 4242
    ingress_control = False

  [[TCP Server Beta]]
    type = TCPServerInterface
    enabled = True
    listen_ip = 0.0.0.0
    listen_port = 4243
    ingress_control = False
