# Full profile — everything Styrene-managed.
# All RNS peers, LXMF propagation, API, overlays in managed mode.
# Styrened owns i2p/yggdrasil process lifecycle — no system daemons needed.
# Use for: complete end-to-end testing, COP with all surfaces populated.

reticulum:
  mode: standalone
  enable_transport: true
  announce_interval: 60
  interfaces:
    auto: true
    server:
      enabled: true
      listen_ip: "0.0.0.0"
      port: 4242
    peers:
      - host: rns.styrene.io
        port: 4242
        name: "Styrene Community Hub"
        enabled: true
      - host: dublin.connect.reticulum.network
        port: 4965
        name: "RNS Dublin"
        enabled: true
      - host: reticulum.betweentheborders.com
        port: 4242
        name: "BetweenTheBorders"
        enabled: true

lxmf:
  autopeer: true
  propagation_node:
    enabled: true
    destination: 6fc8bf22aa293588c9bf8d7488102e95

api:
  enabled: true
  host: "127.0.0.1"
  port: 8000
  public_mode: false

i2p:
  mode: managed

yggdrasil:
  mode: managed

mesh_vpn:
  enable: false
