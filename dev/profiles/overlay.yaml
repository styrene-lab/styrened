# Overlay profile — RNS + hub + i2p/yggdrasil in adopt mode.
# Adopts already-running system daemons — start them first:
#   just overlay-start
# or manually:
#   brew services start yggdrasil && brew services start i2pd   (macOS)
#   systemctl start yggdrasil && systemctl start i2pd           (Linux)
# Use for: testing COP adapter status, overlay address exchange, I2P pages.

reticulum:
  mode: standalone
  enable_transport: true
  announce_interval: 60
  interfaces:
    auto: true
    server:
      enabled: false
    peers:
      - host: rns.styrene.io
        port: 4242
        name: "Styrene Community Hub"
        enabled: true

lxmf:
  autopeer: true
  propagation_node:
    enabled: true
    destination: 6fc8bf22aa293588c9bf8d7488102e95

api:
  enabled: false

i2p:
  mode: adopt

yggdrasil:
  mode: adopt

mesh_vpn:
  enable: false
