name: PR Validation - Smoke Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  KIND_VERSION: v0.20.0
  KUBECTL_VERSION: v1.28.0
  HELM_VERSION: v3.13.0
  REGISTRY: ghcr.io
  IMAGE_NAME_PROD: styrene-lab/styrened
  IMAGE_NAME_TEST: styrene-lab/styrened-test

jobs:
  smoke-tests:
    name: Fast PR Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build test image
        run: just build-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist kubernetes

      - name: Set up kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: styrene-pr-test

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Load test image into kind
        run: |
          kind load docker-image styrene-lab/styrened-test:test --name styrene-pr-test

      - name: Verify image loaded
        run: |
          docker exec styrene-pr-test-control-plane crictl images | grep styrened-test

      - name: Run smoke tests
        run: |
          pytest tests/k8s/ -m smoke -v --tb=short -n 4 --dist loadscope

      - name: Generate test summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: ${{ job.duration }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Tier**: Smoke (fast validation)" >> $GITHUB_STEP_SUMMARY

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/k8s-logs
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | while read ns; do
            echo "=== Namespace: $ns ==="
            kubectl get pods -n $ns || true
            kubectl get pods -n $ns -o name | while read pod; do
              pod_name=$(basename $pod)
              echo "=== Logs: $pod_name ==="
              kubectl logs $pod_name -n $ns --tail=200 > /tmp/k8s-logs/${ns}_${pod_name}.log 2>&1 || true
            done
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-test-logs
          path: /tmp/k8s-logs/
          retention-days: 7

      - name: Cleanup test namespaces
        if: always()
        run: |
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force || true

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = `**Smoke Tests ${status.toUpperCase()}**

            - **Duration**: ~5-10 minutes
            - **Tests**: Fast validation tier
            - **Result**: ${status}

            ${status === 'failure' ? 'Smoke tests failed. Please review logs and fix critical issues.' : 'All smoke tests passed. PR is ready for review.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
