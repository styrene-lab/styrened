name: Manual Test Execution

on:
  workflow_dispatch:
    inputs:
      test_tier:
        description: "Test tier to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - integration
          - comprehensive
          - all
      workers:
        description: "Number of parallel workers (1-8)"
        required: false
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "6"
          - "8"
      test_pattern:
        description: "Specific test pattern (optional, e.g., test_edge_cases.py::test_network_partition)"
        required: false
        type: string
      run_slow_tests:
        description: "Run slow tests (load/scaling)"
        required: false
        default: false
        type: boolean

env:
  KIND_VERSION: v0.20.0
  KUBECTL_VERSION: v1.28.0
  HELM_VERSION: v3.13.0
  REGISTRY: ghcr.io
  IMAGE_NAME_TEST: styrene-lab/styrened-test

jobs:
  manual-test:
    name: Manual Test - ${{ inputs.test_tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build test image
        run: nix build .#oci-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist pytest-cov kubernetes

      - name: Set up kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: styrene-manual

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Load test image into kind
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          nix run .#oci-test.copyToDockerDaemon
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:${VERSION} styrened-test:latest
          kind load docker-image styrened-test:latest --name styrene-manual

      - name: Verify image loaded
        run: |
          docker exec styrene-manual-control-plane crictl images | grep styrened-test

      - name: Build pytest command
        id: pytest
        run: |
          # Base command
          CMD="pytest tests/k8s/"

          # Add test pattern if specified
          if [[ -n "${{ inputs.test_pattern }}" ]]; then
            CMD="$CMD${{ inputs.test_pattern }}"
          fi

          # Add tier marker unless pattern specified or all selected
          if [[ -z "${{ inputs.test_pattern }}" ]] && [[ "${{ inputs.test_tier }}" != "all" ]]; then
            CMD="$CMD -m ${{ inputs.test_tier }}"
          fi

          # Add verbose and traceback options
          CMD="$CMD -v --tb=short"

          # Add slow tests flag if enabled
          if [[ "${{ inputs.run_slow_tests }}" == "true" ]]; then
            CMD="$CMD --run-slow"
          fi

          # Add coverage
          CMD="$CMD --cov=src --cov-report=xml --cov-report=term --cov-report=html"

          # Add parallelization
          CMD="$CMD -n ${{ inputs.workers }} --dist loadscope"

          echo "command=$CMD" >> $GITHUB_OUTPUT
          echo "Running: $CMD"

      - name: Run tests
        run: ${{ steps.pytest.outputs.command }}

      - name: Generate test summary
        if: always()
        run: |
          echo "## Manual Test Execution Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Test Tier: ${{ inputs.test_tier }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workers: ${{ inputs.workers }}" >> $GITHUB_STEP_SUMMARY
          echo "- Slow Tests: ${{ inputs.run_slow_tests }}" >> $GITHUB_STEP_SUMMARY
          if [[ -n "${{ inputs.test_pattern }}" ]]; then
            echo "- Pattern: ${{ inputs.test_pattern }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: manual-${{ inputs.test_tier }}
          name: manual-test-${{ github.run_id }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-test-coverage-${{ github.run_id }}
          path: htmlcov/
          retention-days: 30

      - name: Collect test logs
        if: always()
        run: |
          mkdir -p /tmp/manual-test-logs

          # Collect namespace info
          kubectl get namespaces | grep styrene-test > /tmp/manual-test-logs/namespaces.txt 2>&1 || true

          # Collect pod logs
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | while read ns; do
            echo "=== Namespace: $ns ===" >> /tmp/manual-test-logs/cluster-state.txt
            kubectl get pods -n $ns >> /tmp/manual-test-logs/cluster-state.txt 2>&1 || true

            kubectl get pods -n $ns -o name | while read pod; do
              pod_name=$(basename $pod)
              kubectl logs $pod_name -n $ns --tail=1000 > /tmp/manual-test-logs/${ns}_${pod_name}.log 2>&1 || true
              kubectl describe pod $pod_name -n $ns > /tmp/manual-test-logs/${ns}_${pod_name}_describe.txt 2>&1 || true
            done
          done

          # Collect cluster-wide info
          kubectl get all --all-namespaces | grep styrene > /tmp/manual-test-logs/all-resources.txt 2>&1 || true
          kubectl top nodes > /tmp/manual-test-logs/node-usage.txt 2>&1 || echo "Metrics server not available" > /tmp/manual-test-logs/node-usage.txt

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-test-logs-${{ github.run_id }}
          path: /tmp/manual-test-logs/
          retention-days: 30

      - name: Display test results
        if: always()
        run: |
          echo "==============================================="
          echo "Manual Test Execution Complete"
          echo "==============================================="
          echo "Test Tier: ${{ inputs.test_tier }}"
          echo "Workers: ${{ inputs.workers }}"
          echo "Status: ${{ job.status }}"
          echo ""
          echo "Artifacts available:"
          echo "- Coverage report: manual-test-coverage-${{ github.run_id }}"
          echo "- Test logs: manual-test-logs-${{ github.run_id }}"
          echo "==============================================="

      - name: Cleanup test namespaces
        if: always()
        run: |
          echo "Cleaning up test namespaces..."
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force || true

          echo "Final cluster state:"
          kubectl get all --all-namespaces | grep styrene || echo "All styrene resources cleaned up"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            console.log(`Manual test execution failed`);
            console.log(`Requested by: ${actor}`);
            console.log(`Test tier: ${{ inputs.test_tier }}`);
            console.log(`Workers: ${{ inputs.workers }}`);
            console.log(`View logs: ${runUrl}`);
