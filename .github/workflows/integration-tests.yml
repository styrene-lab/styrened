name: Integration Tests

# Run on-demand or after releases
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to test (e.g., 0.3.3, latest, edge)"
        required: true
        default: "latest"
        type: string
      test_tier:
        description: "Test tier to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - integration
          - comprehensive
          - all
      cluster:
        description: "Target cluster"
        required: true
        default: "kind"
        type: choice
        options:
          - kind
          - brutus
  workflow_run:
    workflows: ["Release Build"]
    types: [completed]
    branches: [main]

env:
  KIND_VERSION: v0.20.0
  KUBECTL_VERSION: v1.28.0
  HELM_VERSION: v3.13.0
  REGISTRY: ghcr.io
  IMAGE_NAME_TEST: styrene-lab/styrened-test

jobs:
  integration-tests-kind:
    name: Integration Tests (kind)
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.cluster == 'kind') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist pytest-cov kubernetes

      - name: Set up kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: styrene-test

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Pull and load test image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:${{ steps.image.outputs.tag }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:${{ steps.image.outputs.tag }} styrened-test:latest
          kind load docker-image styrened-test:latest --name styrene-test

      - name: Determine test markers
        id: markers
        run: |
          TIER="${{ inputs.test_tier || 'smoke' }}"
          case "$TIER" in
            smoke)
              echo "markers=-m smoke" >> $GITHUB_OUTPUT
              ;;
            integration)
              echo "markers=-m 'smoke or integration'" >> $GITHUB_OUTPUT
              ;;
            comprehensive)
              echo "markers=-m 'smoke or integration or comprehensive'" >> $GITHUB_OUTPUT
              ;;
            all)
              echo "markers=--run-slow" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Run integration tests
        run: |
          pytest tests/k8s/ -v --tb=short ${{ steps.markers.outputs.markers }} \
            --cov=src --cov-report=xml --cov-report=term \
            -n 4 --dist loadscope

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: integration
          name: integration-${{ steps.image.outputs.tag }}

      - name: Collect test logs
        if: always()
        run: |
          mkdir -p /tmp/test-logs
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | while read ns; do
            kubectl get pods -n $ns -o name | while read pod; do
              pod_name=$(basename $pod)
              kubectl logs $pod_name -n $ns --tail=1000 > /tmp/test-logs/${ns}_${pod_name}.log 2>&1 || true
            done
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-kind
          path: /tmp/test-logs/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force || true

  integration-tests-brutus:
    name: Integration Tests (brutus)
    if: github.event_name == 'workflow_dispatch' && inputs.cluster == 'brutus'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist pytest-cov kubernetes

      - name: Configure kubectl for brutus
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.BRUTUS_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Determine test markers
        id: markers
        run: |
          TIER="${{ inputs.test_tier }}"
          case "$TIER" in
            smoke)
              echo "markers=-m smoke" >> $GITHUB_OUTPUT
              ;;
            integration)
              echo "markers=-m 'smoke or integration'" >> $GITHUB_OUTPUT
              ;;
            comprehensive)
              echo "markers=-m 'smoke or integration or comprehensive'" >> $GITHUB_OUTPUT
              ;;
            all)
              echo "markers=--run-slow" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Run integration tests
        env:
          STYRENED_TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:${{ inputs.image_tag }}
          STYRENED_TEST_CLUSTER: brutus
        run: |
          pytest tests/k8s/ -v --tb=short ${{ steps.markers.outputs.markers }} \
            --cov=src --cov-report=xml --cov-report=term \
            -n 4 --dist loadscope

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: integration-brutus
          name: integration-brutus-${{ inputs.image_tag }}

      - name: Collect test logs
        if: always()
        run: |
          mkdir -p /tmp/test-logs
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | while read ns; do
            kubectl get pods -n $ns -o name | while read pod; do
              pod_name=$(basename $pod)
              kubectl logs $pod_name -n $ns --tail=1000 > /tmp/test-logs/${ns}_${pod_name}.log 2>&1 || true
            done
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-brutus
          path: /tmp/test-logs/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force || true
