name: Kubernetes Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  KIND_VERSION: v0.20.0
  KUBECTL_VERSION: v1.28.0
  HELM_VERSION: v3.13.0

jobs:
  k8s-tests:
    name: K8s Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Set up kind
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: styrene-test

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Build test image
        run: |
          cd tests/k8s
          docker build -t styrened-test:latest -f docker/Dockerfile ../..

      - name: Load image into kind
        run: |
          kind load docker-image styrened-test:latest --name styrene-test

      - name: Verify image loaded
        run: |
          docker exec styrene-test-control-plane crictl images | grep styrened-test

      - name: Run edge case tests
        run: |
          pytest tests/k8s/scenarios/test_edge_cases.py -v --tb=short

      - name: Run load tests
        run: |
          pytest tests/k8s/scenarios/test_load.py -v --tb=short --run-slow

      - name: Run scaling tests
        run: |
          pytest tests/k8s/scenarios/test_scaling.py -v --tb=short --run-slow

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/k8s-logs
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | while read ns; do
            echo "=== Namespace: $ns ==="
            kubectl get pods -n $ns
            kubectl get pods -n $ns -o name | while read pod; do
              pod_name=$(basename $pod)
              echo "=== Logs: $pod_name ==="
              kubectl logs $pod_name -n $ns --tail=100 > /tmp/k8s-logs/${ns}_${pod_name}.log 2>&1 || true
            done
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-test-logs
          path: /tmp/k8s-logs/
          retention-days: 7

      - name: Cleanup stuck resources
        if: always()
        run: |
          # Force delete test namespaces
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force

      - name: Show cluster resources
        if: always()
        run: |
          kubectl top nodes || echo "Metrics server not available"
          kubectl get all --all-namespaces | grep styrene || echo "No styrene resources found"

  quick-smoke:
    name: Quick Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Set up kind
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: styrene-smoke

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build test image
        run: |
          cd tests/k8s
          docker build -t styrened-test:latest -f docker/Dockerfile ../..

      - name: Load image into kind
        run: |
          kind load docker-image styrened-test:latest --name styrene-smoke

      - name: Run single smoke test
        run: |
          pytest tests/k8s/scenarios/test_edge_cases.py::test_network_partition -v

      - name: Cleanup
        if: always()
        run: |
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force
