name: Release Build

on:
  push:
    tags:
      - "v*" # v0.2.0, v0.2.1, v1.0.0-rc1, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.2.1)"
        required: true
        type: string

# Required for GHCR push and release creation
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PROD: styrene-lab/styrened

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ (rc|alpha|beta) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "Release version: $VERSION"

  build-wheel:
    name: Build Python Wheel
    needs: validate-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify version matches tag
        run: |
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${{ needs.validate-tag.outputs.version }}"

          if [[ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: pyproject.toml version ($PYPROJECT_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PYPROJECT_VERSION"

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/
          retention-days: 90

  build-images:
    name: Build and Push OCI Images
    needs: [validate-tag, build-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build OCI image
        run: nix build .#oci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push production image
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          COMMIT_SHA=$(git rev-parse --short=7 HEAD)

          nix run .#oci.copyToDockerDaemon
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${VERSION}

          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${VERSION} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${COMMIT_SHA}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${COMMIT_SHA}

          if [[ "${{ needs.validate-tag.outputs.is_prerelease }}" == "false" ]]; then
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${VERSION} \
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:latest
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:latest
          fi

  generate-changelog:
    name: Generate Changelog
    needs: validate-tag
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "First release - collecting all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            echo "Previous tag: $PREVIOUS_TAG"
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
          fi

          # Generate changelog content
          CHANGELOG="## What's Changed

          $COMMITS

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${{ needs.validate-tag.outputs.version }}"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    needs: [validate-tag, build-wheel, build-images, generate-changelog]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: /tmp/wheel

      - name: Create release archive
        run: |
          mkdir -p /tmp/release-package

          # Copy wheel and sdist
          cp /tmp/wheel/*.whl /tmp/release-package/
          cp /tmp/wheel/*.tar.gz /tmp/release-package/

          # Package source code
          tar czf /tmp/release-package/styrened-${{ needs.validate-tag.outputs.version }}-source.tar.gz \
            --exclude='.git' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            .

          ls -la /tmp/release-package/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: Release v${{ needs.validate-tag.outputs.version }}
          body: |
            # Styrened v${{ needs.validate-tag.outputs.version }}

            ${{ needs.generate-changelog.outputs.changelog }}

            ## Installation

            ### From GitHub Release
            ```bash
            # Install wheel directly
            pip install https://github.com/styrene-lab/styrened/releases/download/v${{ needs.validate-tag.outputs.version }}/styrened-${{ needs.validate-tag.outputs.version }}-py3-none-any.whl

            # Or install from git tag
            pip install git+https://github.com/styrene-lab/styrened.git@v${{ needs.validate-tag.outputs.version }}
            ```

            ## Container Images

            OCI images (linux/amd64):
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${{ needs.validate-tag.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:latest
            ```

            ## Nix
            ```bash
            nix run github:styrene-lab/styrened/v${{ needs.validate-tag.outputs.version }}
            ```
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.is_prerelease == 'true' }}
          files: |
            /tmp/release-package/*.whl
            /tmp/release-package/*.tar.gz
