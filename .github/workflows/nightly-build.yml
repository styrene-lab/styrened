name: Nightly Build - Comprehensive Tests

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch:
    inputs:
      test_tier:
        description: "Test tier to run"
        required: false
        default: "all"
        type: choice
        options:
          - smoke
          - integration
          - comprehensive
          - all
      workers:
        description: "Number of parallel workers"
        required: false
        default: "8"
        type: string

env:
  KIND_VERSION: v0.20.0
  KUBECTL_VERSION: v1.28.0
  HELM_VERSION: v3.13.0
  REGISTRY: ghcr.io
  IMAGE_NAME_PROD: styrene-lab/styrened
  IMAGE_NAME_TEST: styrene-lab/styrened-test

jobs:
  build-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Required for GHCR push
    permissions:
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          COMMIT_SHA=$(git rev-parse --short=7 HEAD)

          nix build .#oci-test
          nix run .#oci-test.copyToDockerDaemon
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:${VERSION}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:${VERSION} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:latest

      - name: Build and push edge image
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          COMMIT_SHA=$(git rev-parse --short=7 HEAD)

          nix build .#oci
          nix run .#oci.copyToDockerDaemon
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${VERSION} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:edge
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:edge
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${VERSION} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${COMMIT_SHA}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${COMMIT_SHA}

  test-smoke:
    name: Smoke Tests
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.test_tier == 'smoke' || inputs.test_tier == 'all' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist pytest-cov kubernetes

      - name: Set up kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: styrene-nightly

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and load test image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:latest styrened-test:latest
          kind load docker-image styrened-test:latest --name styrene-nightly

      - name: Run smoke tests
        run: |
          pytest tests/k8s/ -m smoke -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term \
            -n ${{ inputs.workers || '8' }} --dist loadscope

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: smoke
          name: smoke-tests

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/smoke-logs
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | while read ns; do
            kubectl get pods -n $ns -o name | while read pod; do
              pod_name=$(basename $pod)
              kubectl logs $pod_name -n $ns --tail=500 > /tmp/smoke-logs/${ns}_${pod_name}.log 2>&1 || true
            done
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-logs
          path: /tmp/smoke-logs/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force || true

  test-integration:
    name: Integration Tests
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: inputs.test_tier == 'integration' || inputs.test_tier == 'all' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist pytest-cov kubernetes

      - name: Set up kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: styrene-nightly

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and load test image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:latest styrened-test:latest
          kind load docker-image styrened-test:latest --name styrene-nightly

      - name: Run integration tests
        run: |
          pytest tests/k8s/ -m integration -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term \
            -n ${{ inputs.workers || '8' }} --dist loadscope

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: integration
          name: integration-tests

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/integration-logs
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | while read ns; do
            kubectl get pods -n $ns -o name | while read pod; do
              pod_name=$(basename $pod)
              kubectl logs $pod_name -n $ns --tail=500 > /tmp/integration-logs/${ns}_${pod_name}.log 2>&1 || true
            done
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-integration-logs
          path: /tmp/integration-logs/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force || true

  test-comprehensive:
    name: Comprehensive Tests
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: inputs.test_tier == 'comprehensive' || inputs.test_tier == 'all' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist pytest-cov kubernetes

      - name: Set up kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: styrene-nightly

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and load test image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEST }}:latest styrened-test:latest
          kind load docker-image styrened-test:latest --name styrene-nightly

      - name: Run comprehensive tests
        run: |
          pytest tests/k8s/ -m comprehensive -v --tb=short --run-slow \
            --cov=src --cov-report=xml --cov-report=term \
            -n ${{ inputs.workers || '8' }} --dist loadscope

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: comprehensive
          name: comprehensive-tests

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/comprehensive-logs
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | while read ns; do
            kubectl get pods -n $ns -o name | while read pod; do
              pod_name=$(basename $pod)
              kubectl logs $pod_name -n $ns --tail=1000 > /tmp/comprehensive-logs/${ns}_${pod_name}.log 2>&1 || true
            done
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-comprehensive-logs
          path: /tmp/comprehensive-logs/
          retention-days: 30

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-metrics-${{ github.run_number }}
          path: /tmp/styrene-test-metrics/
          retention-days: 90
          compression-level: 9

      - name: Cleanup
        if: always()
        run: |
          kubectl get namespaces | grep styrene-test | awk '{print $1}' | xargs -r kubectl delete namespace --grace-period=0 --force || true

  generate-report:
    name: Generate Test Report
    needs: [test-smoke, test-integration, test-comprehensive]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/test-artifacts

      - name: Generate summary report
        run: |
          echo "# Nightly Test Report - $(date +'%Y-%m-%d')" > /tmp/report.md
          echo "" >> /tmp/report.md
          echo "## Test Results" >> /tmp/report.md
          echo "- Smoke Tests: ${{ needs.test-smoke.result }}" >> /tmp/report.md
          echo "- Integration Tests: ${{ needs.test-integration.result }}" >> /tmp/report.md
          echo "- Comprehensive Tests: ${{ needs.test-comprehensive.result }}" >> /tmp/report.md
          echo "" >> /tmp/report.md
          echo "## Artifacts" >> /tmp/report.md
          echo "Test logs and coverage reports are available in workflow artifacts." >> /tmp/report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-report
          path: /tmp/report.md
          retention-days: 30

      - name: Create issue on failure
        if: failure() || needs.test-smoke.result == 'failure' || needs.test-integration.result == 'failure' || needs.test-comprehensive.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly Build Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `**Nightly build failure detected**

            **Results:**
            - Smoke Tests: ${{ needs.test-smoke.result }}
            - Integration Tests: ${{ needs.test-integration.result }}
            - Comprehensive Tests: ${{ needs.test-comprehensive.result }}

            **Workflow:** [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Next Steps:**
            1. Review test logs in workflow artifacts
            2. Identify failing tests and root causes
            3. Fix issues and verify with local test run
            4. Monitor next nightly build for resolution
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['ci-failure', 'nightly-build']
            });
