name: Edge Build - Main Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for GHCR push
permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PROD: styrene-lab/styrened

jobs:
  build-edge:
    name: Build and Push Edge Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build OCI image
        run: nix build .#oci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push edge image
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          COMMIT_SHA=$(git rev-parse --short=7 HEAD)

          nix run .#oci.copyToDockerDaemon
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${VERSION} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:edge
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:edge

          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${VERSION} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${COMMIT_SHA}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:${COMMIT_SHA}

      - name: Generate build summary
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          COMMIT_SHA=$(git rev-parse --short=7 HEAD)
          echo "## Edge Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:edge\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PROD }}:edge" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
