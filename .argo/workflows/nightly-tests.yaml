# Nightly build: test main, build OCI, push :nightly and :nightly-{sha} tags
# Triggered by CronWorkflow (see cron-nightly.yaml)
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: styrened-nightly-tests
  namespace: argo
spec:
  arguments:
    parameters:
      - name: test-tier
        value: "smoke or integration"
      - name: repo
        value: styrene-lab/styrened
  entrypoint: pipeline
  serviceAccountName: ci-workflow-sa

  hooks:
    exit:
      template: notify-nightly-result

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

  volumes:
    - name: ghcr-auth
      secret:
        secretName: ghcr-secret
    - name: cachix-auth
      secret:
        secretName: cachix-auth-token
    - name: ntfy-auth
      secret:
        secretName: ntfy-secret

  templates:
    - name: pipeline
      dag:
        tasks:
          - name: checkout
            template: git-checkout
          - name: smoke
            template: run-tests
            depends: "checkout"
            arguments:
              parameters:
                - name: marker
                  value: smoke
                - name: timeout
                  value: "600"
          - name: integration
            template: run-tests
            depends: "smoke.Succeeded"
            when: "'{{workflow.parameters.test-tier}}' != 'smoke'"
            arguments:
              parameters:
                - name: marker
                  value: integration
                - name: timeout
                  value: "1800"
          - name: comprehensive
            template: run-tests
            depends: "integration.Succeeded"
            when: "'{{workflow.parameters.test-tier}}' == 'all'"
            arguments:
              parameters:
                - name: marker
                  value: comprehensive
                - name: timeout
                  value: "3600"
          # Operator interface path tests (TUI pilot + live daemon)
          - name: operator-paths
            template: run-operator-paths
            depends: "smoke.Succeeded"
            arguments:
              parameters:
                - name: timeout
                  value: "300"
          # Build + push nightly OCI after tests pass
          - name: build
            template: nix-build-oci
            depends: "smoke.Succeeded"
          - name: push
            template: push-ghcr-nightly
            depends: "build.Succeeded"

    - name: git-checkout
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            TOKEN=$(cat /ghcr/password)
            git clone --depth 1 \
              https://x-access-token:${TOKEN}@github.com/{{workflow.parameters.repo}}.git \
              /workspace/src
            cd /workspace/src
            git rev-parse --short HEAD > /workspace/short-sha
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: ghcr-auth
            mountPath: /ghcr
            readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi

    - name: run-operator-paths
      inputs:
        parameters:
          - name: timeout
      activeDeadlineSeconds: "{{inputs.parameters.timeout}}"
      container:
        image: python:3.11-slim
        command: [sh, -c]
        args:
          - |
            set -eu

            cd /workspace/src

            # Install styrened with TUI + test dependencies
            pip install --quiet -e ".[tui,dev]" 2>&1 | tail -5
            pip install --quiet pytest pytest-asyncio pyyaml 2>&1 | tail -2

            echo "Running operator path tests..."
            mkdir -p /workspace/results

            python -m pytest tests/tui/operator/ \
              -m operator_path -v --tb=short \
              --junitxml=/workspace/results/operator-paths-results.xml \
              2>&1 | tee /workspace/results/operator-paths-output.log

            echo "exit_code=$?" > /workspace/results/operator-paths-status
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi

    - name: run-tests
      inputs:
        parameters:
          - name: marker
          - name: timeout
      activeDeadlineSeconds: "{{inputs.parameters.timeout}}"
      container:
        image: python:3.11-slim
        command: [sh, -c]
        args:
          - |
            set -eu

            # Install kubectl + helm (required by test harness)
            apt-get update -qq && apt-get install -qq -y curl >/dev/null 2>&1
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            install kubectl /usr/local/bin/kubectl && rm kubectl
            curl -sL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash >/dev/null 2>&1

            pip install --quiet pytest pytest-asyncio pytest-xdist kubernetes pyyaml msgpack-python
            cd /workspace/src
            mkdir -p /workspace/results

            MARKER="{{inputs.parameters.marker}}"
            echo "Running ${MARKER} tests..."
            pytest tests/k8s/scenarios/ -m "${MARKER}" -v --tb=short -n 4 --dist loadscope \
              --junitxml=/workspace/results/${MARKER}-results.xml \
              2>&1 | tee /workspace/results/${MARKER}-output.log
            echo "exit_code=$?" > /workspace/results/${MARKER}-status
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi

    - name: nix-build-oci
      container:
        image: nixos/nix:latest
        command: ["/bin/sh", "-c"]
        env:
          - name: PATH
            value: "/root/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/bin:/usr/bin"
        args:
          - |
            set -euo pipefail
            mkdir -p /etc/nix
            echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
            echo "sandbox = false" >> /etc/nix/nix.conf
            echo "max-jobs = auto" >> /etc/nix/nix.conf
            echo "cores = 0" >> /etc/nix/nix.conf

            # Configure Cachix for faster builds
            nix-env -iA cachix -f https://cachix.org/api/v1/install
            export CACHIX_AUTH_TOKEN=$(cat /cachix/token)
            cachix use styrene

            cd /workspace/src
            echo "Building OCI image..."
            nix build .#oci --no-link --print-out-paths > /workspace/oci-path
            echo "Build complete: $(cat /workspace/oci-path)"

            # Push build results to Cachix for future runs
            cachix push styrene $(cat /workspace/oci-path)
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cachix-auth
            mountPath: /cachix
            readOnly: true
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
          limits:
            cpu: "16"
            memory: 32Gi

    - name: push-ghcr-nightly
      container:
        image: nixos/nix:latest
        command: ["/bin/sh", "-c"]
        env:
          - name: PATH
            value: "/root/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/bin:/usr/bin"
        args:
          - |
            set -euo pipefail
            mkdir -p /etc/nix
            echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
            echo "sandbox = false" >> /etc/nix/nix.conf

            # Configure Cachix
            nix-env -iA cachix -f https://cachix.org/api/v1/install
            export CACHIX_AUTH_TOKEN=$(cat /cachix/token)
            cachix use styrene

            cd /workspace/src
            SHORT_SHA=$(cat /workspace/short-sha | tr -d '\n')
            VERSION=$(cat VERSION | tr -d '\n')

            # Auth
            mkdir -p ~/.docker
            GHCR_USER=$(cat /ghcr/username 2>/dev/null || echo "styrene-lab")
            GHCR_TOKEN=$(cat /ghcr/password)
            echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$(echo -n "${GHCR_USER}:${GHCR_TOKEN}" | base64)\"}}}" > ~/.docker/config.json

            # Trust policy for skopeo
            mkdir -p /etc/containers
            echo '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json

            # Push version tag via nix2container
            echo "Pushing nightly image..."
            nix run .#oci.copyToRegistry

            # Tag as nightly and nightly-{sha}
            nix-env -iA nixpkgs.skopeo 2>/dev/null || true
            skopeo copy --authfile ~/.docker/config.json \
              docker://ghcr.io/styrene-lab/styrened:${VERSION} \
              docker://ghcr.io/styrene-lab/styrened:nightly
            skopeo copy --authfile ~/.docker/config.json \
              docker://ghcr.io/styrene-lab/styrened:${VERSION} \
              docker://ghcr.io/styrene-lab/styrened:nightly-${SHORT_SHA}

            echo "Pushed: nightly, nightly-${SHORT_SHA}, ${VERSION}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cachix-auth
            mountPath: /cachix
            readOnly: true
          - name: ghcr-auth
            mountPath: /ghcr
            readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi

    - name: notify-nightly-result
      container:
        image: curlimages/curl:latest
        command: [sh, -c]
        args:
          - |
            NTFY_TOKEN=$(cat /ntfy/token)
            ARGO_URL="https://argo.vanderlyn.house/workflows/argo/{{workflow.name}}"
            if [ "{{workflow.status}}" = "Succeeded" ]; then
              curl -sf \
                -H "Authorization: Bearer ${NTFY_TOKEN}" \
                -H "Title: Nightly passed" \
                -H "Priority: 2" \
                -H "Tags: white_check_mark" \
                -H "Click: ${ARGO_URL}" \
                -d "Tests passed, OCI pushed as :nightly" \
                http://ntfy.ntfy.svc.cluster.local/styrene-ci || true
            else
              curl -sf \
                -H "Authorization: Bearer ${NTFY_TOKEN}" \
                -H "Title: Nightly FAILED" \
                -H "Priority: 4" \
                -H "Tags: warning" \
                -H "Click: ${ARGO_URL}" \
                -d "Workflow {{workflow.name}} failed — check Argo for details" \
                http://ntfy.ntfy.svc.cluster.local/styrene-ci || true
            fi
        volumeMounts:
          - name: ntfy-auth
            mountPath: /ntfy
            readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
