# Nightly cron: test main, build + push OCI with :nightly and :nightly-{sha} tags
# Tagged releases (v*) are "islands of stability" — nightly builds are continuous.
# Test tiers: smoke (unit + fast integration), integration (multi-pod),
# operator-paths (TUI pilot against live daemon subprocesses, runs after smoke).
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: styrened-nightly
  namespace: argo
spec:
  schedule: "0 2 * * *"
  timezone: "UTC"
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 600
  workflowSpec:
    workflowTemplateRef:
      name: styrened-nightly-tests
    arguments:
      parameters:
        - name: test-tier
          value: "smoke or integration"
