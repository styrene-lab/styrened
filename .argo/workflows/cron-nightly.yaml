# Nightly cron: test main, build + push OCI with :nightly and :nightly-{sha} tags
# Tagged releases (v*) are "islands of stability" — nightly builds are continuous.
#
# Test tiers run in DAG:
#   checkout → smoke → integration → comprehensive (if test-tier=all)
#   checkout → operator-paths (parallel with smoke, TUI pilot tests)
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: styrened-nightly
  namespace: argo
spec:
  schedule: "0 2 * * *"
  timezone: "UTC"
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 600
  workflowSpec:
    workflowTemplateRef:
      name: styrened-nightly-tests
    arguments:
      parameters:
        - name: test-tier
          value: "smoke or integration"
